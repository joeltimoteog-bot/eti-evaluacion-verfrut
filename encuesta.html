*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--surf);color:var(--text);font-family:Barlow,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh;min-height:100dvh}
.top{background:linear-gradient(135deg,#001A4D,var(--navy) 60%,#0050C8);color:#fff;padding:14px 18px 54px}
.top .row{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.logo{width:40px;height:40px;border-radius:9px;background:#fff var(--logo) center/contain no-repeat;flex:0 0 auto}
.top small{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;font-weight:700}
.top b{font-size:15px}
.wrap{max-width:640px;margin:-40px auto 0;padding:0 14px 40px;position:relative}
.card{background:#fff;border-radius:18px;box-shadow:0 10px 34px rgba(0,30,90,.12);padding:22px 20px;margin-bottom:14px}
h1{font-size:24px;line-height:1.15;margin:0 0 8px}
h2{font-size:21px;line-height:1.3;margin:0 0 6px}
p{color:var(--text2);line-height:1.5;margin:0 0 12px;font-size:15px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.info div{background:var(--surf);border-radius:12px;padding:10px 12px}
.info div.full{grid-column:1/-1}
.info span{display:block;font-size:11px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.info b{font-size:14.5px}
label{display:block;font-weight:700;font-size:13px;color:var(--text2);margin:14px 0 6px}
input,select,textarea{width:100%;font:600 17px Barlow,sans-serif;padding:13px 14px;border:2px solid var(--bdr);border-radius:12px;outline:none;color:var(--text);background:#fff}
textarea{min-height:120px;resize:vertical;font-weight:500}
input:focus,select:focus,textarea:focus{border-color:var(--navy)}
.anon{display:flex;gap:10px;align-items:flex-start;background:#E9F7EF;color:#0B5E33;border-radius:12px;padding:11px 13px;font-size:14px;margin:4px 0 10px}
.err{background:#FCE4E7;color:var(--red);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin-top:12px;display:none}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:16px;font:800 17px Barlow,sans-serif;cursor:pointer;background:var(--navy);color:#fff;box-shadow:0 10px 24px rgba(0,61,165,.28)}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.sec{background:#fff;color:var(--navy);border:2px solid var(--bdr);box-shadow:none}
.prog{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px}
.track{height:8px;background:#E4E9F3;border-radius:99px;overflow:hidden;margin-bottom:16px}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),#1DB954);border-radius:99px;transition:width .3s}
.tag{display:inline-block;background:#EEF3FB;color:var(--navy);font-weight:800;font-size:12px;border-radius:99px;padding:5px 11px;margin-bottom:10px}
.caras{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0 4px}
.cara{border:2px solid var(--bdr);background:#fff;border-radius:14px;padding:10px 2px 8px;cursor:pointer;text-align:center;font:700 11.5px/1.15 Barlow,sans-serif;color:var(--text2);transition:transform .12s,border-color .12s,background .12s}
.cara span{display:block;font-size:34px;line-height:1.1;margin-bottom:5px}
.cara.sel{border-color:var(--navy);background:#F1F5FD;color:var(--navy);transform:scale(1.06)}
.ops{display:grid;gap:10px;margin-top:16px}
.op{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid var(--bdr);border-radius:14px;padding:15px;font:700 17px Barlow,sans-serif;color:var(--text);cursor:pointer}
.op span{font-size:26px}
.op.sel{border-color:var(--navy);background:#F1F5FD;color:var(--navy)}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.tipo{border:2px solid var(--bdr);background:#fff;border-radius:14px;padding:12px 8px;font:700 16px Barlow,sans-serif;color:var(--text);cursor:pointer;text-align:center}
.tipo span{display:block;font-size:28px;line-height:1.1;margin-bottom:4px}
.tipo.sel{border-color:var(--navy);background:#F1F5FD;color:var(--navy)}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:18px}
.center{text-align:center}
.ok-anim{width:96px;height:96px;border-radius:50%;background:#E6F7EE;display:flex;align-items:center;justify-content:center;margin:8px auto 14px;font-size:52px;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.load{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 0;color:var(--text2)}
.spin{width:38px;height:38px;border:4px solid #E4E9F3;border-top-color:var(--navy);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hint{font-size:13px;color:#B86E00;background:#FFF4E5;border-radius:10px;padding:8px 11px;margin:0 0 12px;font-weight:600}
.foot{text-align:center;font-size:11.5px;color:#9AA7C2;margin-top:10px}
</style>
</head>
<body>
<div class="top"><div class="row"><div class="logo"></div><div><small>Unifrutti · Gestión Humana</small><b>Encuesta de satisfacción de la capacitación</b></div></div></div>
<div class="wrap" id="app"><div class="card"><div class="load"><div class="spin"></div>Cargando encuesta…</div></div></div>
<script>
/* _ENCUESTA_SAT_V1 (05-nov-2026): encuesta de satisfaccion que responde el personal capacitado al escanear
   el QR del supervisor. Anonima (no pide nombre ni DNI). Se guarda en Supabase (eti.encuestas_sat) y el
   servidor toma supervisor, tema y fecha del QR. Un celular puede usarse para varias personas (modo kiosko). */
(function(){
'use strict';
var API='https://exdjzbfinppzatjyimxn.supabase.co/functions/v1/api/', REG='?forceFunctionRegion=sa-east-1';
var SECTORES=['San Vicente','Algarrobos','Punta Arenas','Planta Rapel','El Papayo','Limones','Olivares Bajo','Los Olivares','Aproa','Santa Rosa'];
var CARAS=['😞','🙁','😐','🙂','😄'];
var PREG=[
 {k:'p1',t:'¿Entendiste lo que explicó el capacitador?',e:['Nada','Poco','Más o menos','Casi todo','Todo']},
 {k:'p2',t:'¿Explicó con palabras sencillas y con ejemplos de tu trabajo?',e:['Nunca','Pocas veces','A veces','Casi siempre','Siempre']},
 {k:'p3',t:'¿Pudiste hacer preguntas y te respondió con respeto y paciencia?',e:['Muy mal','Mal','Regular','Bien','Muy bien']},
 {k:'p4',t:'¿Usó material de apoyo? (afiches, rotafolio, video, folletos)',o:[['si','👍','Sí'],['no','👎','No']]},
 {k:'p4b',t:'¿El material te ayudó a entender mejor el tema?',e:['Nada','Poco','Algo','Bastante','Mucho'],si:function(R){return R.p4==='si';}},
 {k:'p5',t:'¿Qué tan útil es este tema para tu trabajo diario?',e:['Nada útil','Poco útil','Regular','Útil','Muy útil']},
 {k:'p6',t:'Si tienes una queja o un problema en el trabajo, ¿sabes a quién acudir o qué canal usar?',o:[['si','✅','Sí, lo sé'],['nose','🤔','No estoy seguro'],['no','❌','No lo sé']]},
 {k:'p7',t:'El tiempo de la charla fue…',o:[['corto','⏩','Muy corto'],['adecuado','👌','Adecuado'],['largo','🐢','Muy largo']]},
 {k:'p8',t:'¿El lugar y la hora fueron cómodos? (sombra, ruido, poder escuchar bien)',e:['Muy incómodo','Incómodo','Regular','Cómodo','Muy cómodo']},
 {k:'p9',t:'¿Le recomendarías esta charla a un compañero?',e:['Para nada','No mucho','Tal vez','Sí','¡Claro que sí!']}
];
var app=document.getElementById('app'), q=new URLSearchParams(location.search);
var SID=(q.get('s')||'').toUpperCase().replace(/[^A-Z0-9]/g,''), PREVIA=q.get('vista')==='1';
var S=null, R={}, W={}, paso=0;
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtF(f){if(!f)return'';var p=String(f).slice(0,10).split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
function api(r,b){return fetch(API+r+REG,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(x){return x.json().catch(function(){return{};}).then(function(j){if(!x.ok||!j.success)throw Object.assign(new Error(j.error||('HTTP '+x.status)),{status:x.status});return j;});});}
function msg(ico,tit,txt){app.innerHTML='<div class="card center"><div style="font-size:60px;margin:6px 0">'+ico+'</div><h1>'+tit+'</h1><p>'+txt+'</p></div><div class="foot">Unifrutti Group · Gestión Humana</div>';}
function lista(){return PREG.filter(function(p){return !p.si||p.si(R);});}

function iniciar(){
  if(!SID){msg('🔍','Código no válido','Escanea nuevamente el código QR que te muestra tu supervisor.');return;}
  reenviar();
  api('eti/doc',{col:'encuestas_qr',id:SID}).then(function(j){
    if(!j.existe){msg('🔍','Encuesta no encontrada','El código QR no corresponde a una encuesta activa. Pide a tu supervisor que lo muestre de nuevo.');return;}
    S=j.datos||{};
    if(S.estado!=='abierta'||(S.expira&&Date.now()>S.expira)){msg('⏹','Encuesta cerrada','Esta encuesta ya fue cerrada. ¡Gracias por tu interés!');return;}
    if(!PREVIA&&ls('enc_ok_'+SID)){yaRespondio();return;}
    bienvenida();
  }).catch(function(){msg('📶','Sin conexión','No se pudo cargar la encuesta. Revisa tu señal e inténtalo otra vez.');});
}
function yaRespondio(){
  app.innerHTML='<div class="card center"><div class="ok-anim">💙</div><h1>¡Ya respondiste!</h1><p>Gracias, tu opinión ya está guardada.</p>'+
   '<button class="btn sec" id="bOtra" style="margin-top:8px">👥 Va a responder otra persona con este celular</button></div><div class="foot">Unifrutti Group · Gestión Humana</div>';
  document.getElementById('bOtra').onclick=function(){ls('enc_ok_'+SID,null);R={};W={};bienvenida();};
}
function bienvenida(){
  app.innerHTML='<div class="card"><h1>¡Hola! 👋</h1><p>Queremos saber <b>cómo te pareció la capacitación</b> para seguir mejorando. Son <b>unas 10 preguntas rápidas</b> (1 minuto).</p>'+
   (PREVIA?'<div class="hint">👁 <b>Vista previa del supervisor:</b> puedes recorrerla; no se guarda nada.</div>':'')+
   '<div class="info"><div class="full"><span>Tema</span><b>'+esc(S.tema||'Capacitación')+'</b></div><div><span>Capacitador</span><b>'+esc(S.sup||'—')+'</b></div><div><span>Fecha</span><b>'+esc(fmtF(S.fecha)||'Hoy')+'</b></div></div>'+
   '<div class="anon">🔒 <span><b>Es anónima:</b> no te pedimos nombre ni DNI. Responde con sinceridad, nadie sabrá lo que marcaste.</span></div>'+
   '<button class="btn" id="bIr">Empezar →</button></div><div class="foot">Unifrutti Group · Gestión Humana</div>';
  document.getElementById('bIr').onclick=ubicacion;
}
function ubicacion(){
  var last={};try{last=JSON.parse(ls('enc_ult')||'{}')||{};}catch(e){}
  W.tipo=W.tipo||'';W.sexo=W.sexo||'';W.sector=W.sector||S.sector||last.sector||'';W.ruta=W.ruta||'';
  var sects=SECTORES.slice(); if(W.sector&&sects.indexOf(W.sector)<0)sects.unshift(W.sector);
  function pintar(){
    app.innerHTML='<div class="card"><h2>Cuéntanos un poco de ti</h2><p>Solo para ver los resultados por sector. <b>No guardamos tu nombre ni tu DNI.</b></p>'+
     '<label>Eres…</label><div class="tipos"><button class="tipo'+(W.tipo==='obrero'?' sel':'')+'" data-t="obrero"><span>👷</span>Obrero</button><button class="tipo'+(W.tipo==='empleado'?' sel':'')+'" data-t="empleado"><span>💼</span>Empleado</button></div>'+
     '<div class="tipos"><button class="tipo'+(W.sexo==='H'?' sel':'')+'" data-s="H"><span>👨</span>Hombre</button><button class="tipo'+(W.sexo==='M'?' sel':'')+'" data-s="M"><span>👩</span>Mujer</button></div>'+
     '<label for="sec">Sector o fundo</label><select id="sec"><option value="">— Elige —</option>'+sects.map(function(x){return '<option'+(x===W.sector?' selected':'')+'>'+esc(x)+'</option>';}).join('')+'<option value="Otro">Otro</option></select>'+
     (W.tipo==='empleado'?'':'<label for="ruta">Ruta (si sabes)</label><input id="ruta" autocomplete="off" placeholder="Ej. Ruta 5 / R-05" value="'+esc(W.ruta)+'">')+
     '<div class="err" id="err"></div><div class="nav"><button class="btn sec" id="bAtr">←</button><button class="btn" id="bOk">Continuar →</button></div></div>';
    Array.prototype.forEach.call(app.querySelectorAll('[data-t]'),function(b){b.onclick=function(){leer();W.tipo=b.getAttribute('data-t');pintar();};});
    Array.prototype.forEach.call(app.querySelectorAll('[data-s]'),function(b){b.onclick=function(){leer();W.sexo=b.getAttribute('data-s');pintar();};});
    document.getElementById('bAtr').onclick=bienvenida;
    document.getElementById('bOk').onclick=function(){leer();var e=document.getElementById('err');
      if(!W.tipo||!W.sector){e.textContent='Elige si eres obrero o empleado y tu sector.';e.style.display='block';return;}
      ls('enc_ult',JSON.stringify({sector:W.sector}));paso=0;pregunta();};
  }
  function leer(){var s=document.getElementById('sec'),r=document.getElementById('ruta');if(s)W.sector=s.value;if(r)W.ruta=r.value.trim();}
  pintar();
}
function pregunta(){
  var L=lista(); if(paso>=L.length){comentario();return;}
  var p=L[paso], v=R[p.k], tot=L.length+1;
  var h='<div class="card"><div class="prog"><span>Pregunta '+(paso+1)+' de '+(tot)+'</span><span>'+Math.round(paso/tot*100)+'%</span></div><div class="track"><i style="width:'+(paso/tot*100)+'%"></i></div>'+
    '<h2>'+esc(p.t)+'</h2>';
  if(p.e) h+='<div class="caras">'+p.e.map(function(t,i){return '<button class="cara'+(v===i+1?' sel':'')+'" data-v="'+(i+1)+'" aria-label="'+esc(t)+'"><span>'+CARAS[i]+'</span>'+esc(t)+'</button>';}).join('')+'</div>';
  else h+='<div class="ops">'+p.o.map(function(o){return '<button class="op'+(v===o[0]?' sel':'')+'" data-v="'+o[0]+'"><span>'+o[1]+'</span>'+esc(o[2])+'</button>';}).join('')+'</div>';
  h+='<div class="nav"><button class="btn sec" id="bAtr">← Atrás</button><button class="btn" id="bSig"'+(v?'':' disabled')+'>Siguiente →</button></div></div>';
  app.innerHTML=h; window.scrollTo(0,0);
  Array.prototype.forEach.call(app.querySelectorAll('[data-v]'),function(b){b.onclick=function(){
    var x=b.getAttribute('data-v'); R[p.k]=p.e?+x:x; if(p.k==='p4'&&x!=='si')delete R.p4b;
    Array.prototype.forEach.call(app.querySelectorAll('[data-v]'),function(y){y.classList.toggle('sel',y===b);});
    document.getElementById('bSig').disabled=false; setTimeout(function(){paso++;pregunta();},280);};});
  document.getElementById('bAtr').onclick=function(){if(paso===0)ubicacion();else{paso--;pregunta();}};
  document.getElementById('bSig').onclick=function(){paso++;pregunta();};
}
function comentario(){
  var tot=lista().length+1;
  app.innerHTML='<div class="card"><div class="prog"><span>Pregunta '+tot+' de '+tot+'</span><span>Último paso</span></div><div class="track"><i style="width:96%"></i></div>'+
   '<h2>💬 Déjanos tu opinión</h2><p>¿En qué podemos mejorar para que las capacitaciones sean más claras y amigables para ti? <b>(opcional)</b></p>'+
   '<textarea id="com" maxlength="600" placeholder="Escribe aquí… (puedes dejarlo en blanco)">'+esc(R.coment||'')+'</textarea>'+
   '<div class="err" id="err"></div><div class="nav"><button class="btn sec" id="bAtr">← Atrás</button><button class="btn" id="bEnv">Enviar ✓</button></div></div>';
  document.getElementById('bAtr').onclick=function(){R.coment=document.getElementById('com').value;paso=lista().length-1;pregunta();};
  document.getElementById('bEnv').onclick=enviar;
}
function enviar(){
  var b=document.getElementById('bEnv'), e=document.getElementById('err');
  R.coment=document.getElementById('com').value.trim();
  var resp=Object.assign({},R,{tipo:W.tipo,sexo:W.sexo,sector:W.sector,ruta:W.ruta});
  if(PREVIA){gracias();return;}
  b.disabled=true;b.textContent='Enviando…';
  api('eti/encuesta',{ses:SID,resp:resp}).then(function(){ls('enc_ok_'+SID,'1');gracias();}).catch(function(x){
    if(x.status===409||x.status===404){msg('⏹','Encuesta cerrada','El supervisor ya cerró esta encuesta.');return;}
    if(x.status>=400&&x.status<500){b.disabled=false;b.textContent='Enviar ✓';e.textContent='No se pudo enviar: '+x.message;e.style.display='block';return;}
    /* sin señal: queda guardada en el celular y se envia sola la proxima vez que se abra */
    try{var p=JSON.parse(ls('enc_pend')||'[]');p.push({ses:SID,resp:resp});ls('enc_pend',JSON.stringify(p.slice(-30)));}catch(z){}
    ls('enc_ok_'+SID,'1'); gracias(true);
  });
}
function reenviar(){
  var p=[];try{p=JSON.parse(ls('enc_pend')||'[]');}catch(e){} if(!p.length)return;
  ls('enc_pend','[]');
  p.forEach(function(x){api('eti/encuesta',x).catch(function(err){if(!(err.status>=400&&err.status<500)){try{var q2=JSON.parse(ls('enc_pend')||'[]');q2.push(x);ls('enc_pend',JSON.stringify(q2));}catch(z){}}});});
}
function gracias(pend){
  app.innerHTML='<div class="card center"><div class="ok-anim">🎉</div><h1>¡Gracias por tu opinión!</h1>'+
   '<p>'+(pend?'No hay buena señal ahora: tu respuesta quedó guardada en este celular y <b>se enviará sola</b> cuando vuelva la conexión.':'Tu respuesta nos ayuda a mejorar las capacitaciones para ti y tus compañeros.')+'</p>'+
   (PREVIA?'':'<button class="btn sec" id="bOtra" style="margin-top:8px">👥 Va a responder otra persona con este celular</button>')+'</div><div class="foot">Unifrutti Group · Gestión Humana</div>';
  var o=document.getElementById('bOtra'); if(o)o.onclick=function(){ls('enc_ok_'+SID,null);R={};W={};bienvenida();};
}
iniciar();
})();
</script>
</body>
</html>
