*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--surf);color:var(--text);font-family:Barlow,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh;min-height:100dvh}
.top{background:linear-gradient(135deg,#001A4D,var(--navy) 60%,#0050C8);color:#fff;padding:14px 18px 54px;position:relative}
.top .row{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.logo{width:40px;height:40px;border-radius:9px;background:#fff var(--logo) center/contain no-repeat;flex:0 0 auto}
.top small{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;font-weight:700}
.top b{font-size:15px}
.wrap{max-width:640px;margin:-40px auto 0;padding:0 14px 110px;position:relative}
.card{background:#fff;border-radius:18px;box-shadow:0 10px 34px rgba(0,30,90,.12);padding:22px 20px;margin-bottom:14px}
h1{font-size:24px;line-height:1.15;margin:0 0 8px}
h2{font-size:19px;line-height:1.3;margin:0 0 14px}
p{color:var(--text2);line-height:1.5;margin:0 0 12px;font-size:15px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.info div{background:var(--surf);border-radius:12px;padding:10px 12px}
.info span{display:block;font-size:11px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.info b{font-size:14px}
.tips{margin:6px 0 0;padding:0;list-style:none}
.tips li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:14.5px;color:var(--text)}
label{display:block;font-weight:700;font-size:13px;color:var(--text2);margin:14px 0 6px}
input{width:100%;font:600 18px Barlow,sans-serif;padding:14px 14px;border:2px solid var(--bdr);border-radius:12px;outline:none;color:var(--text);background:#fff}
input:focus,select:focus{border-color:var(--navy)}
select{width:100%;font:600 17px Barlow,sans-serif;padding:14px 12px;border:2px solid var(--bdr);border-radius:12px;outline:none;color:var(--text);background:#fff}
.fijo{font:700 17px Barlow,sans-serif;padding:13px 14px;border-radius:12px;background:#EEF3FB;color:var(--navy)}
.anon{display:flex;gap:10px;align-items:flex-start;background:#E9F7EF;color:#0B5E33;border-radius:12px;padding:11px 13px;font-size:14px;margin:4px 0 6px}
.err{background:#FCE4E7;color:var(--red);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin-top:12px;display:none}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:16px;font:800 17px Barlow,sans-serif;cursor:pointer;background:var(--navy);color:#fff;box-shadow:0 10px 24px rgba(0,61,165,.28)}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.sec{background:#fff;color:var(--navy);border:2px solid var(--bdr);box-shadow:none}
.btn.red{background:var(--red);box-shadow:0 10px 24px rgba(200,16,46,.28)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bdr);padding:12px 14px calc(12px + env(safe-area-inset-bottom));z-index:5}
.bar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:10px}
.prog{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px}
.track{height:8px;background:#E4E9F3;border-radius:99px;overflow:hidden;margin-bottom:16px}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),#1DB954);border-radius:99px;transition:width .3s}
.tema{display:inline-block;background:#EEF3FB;color:var(--navy);font-weight:800;font-size:12px;border-radius:99px;padding:5px 11px;margin-bottom:10px;letter-spacing:.02em}
.hint{font-size:13px;color:#B86E00;background:#FFF4E5;border-radius:10px;padding:8px 11px;margin:-4px 0 12px;font-weight:600}
.op{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid var(--bdr);border-radius:14px;padding:14px;margin-bottom:10px;font:600 16px/1.35 Barlow,sans-serif;color:var(--text);cursor:pointer;transition:border-color .15s,background .15s}
.op .mk{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid #AAB6CE;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
.op.multi .mk{border-radius:7px}
.op.sel{border-color:var(--navy);background:#F1F5FD}
.op.sel .mk{background:var(--navy);border-color:var(--navy)}
.center{text-align:center}
.big{font-size:64px;line-height:1;margin:10px 0}
.ok-anim{width:96px;height:96px;border-radius:50%;background:#E6F7EE;display:flex;align-items:center;justify-content:center;margin:8px auto 14px;animation:pop .5s ease}
.ok-anim svg{width:54px;height:54px}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.resumen{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0}
.resumen i{height:30px;border-radius:8px;background:#E6F7EE;display:flex;align-items:center;justify-content:center;font:700 12px Barlow;font-style:normal;color:var(--green)}
.resumen i.no{background:#FCE4E7;color:var(--red)}
.load{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 0;color:var(--text2)}
.spin{width:38px;height:38px;border:4px solid #E4E9F3;border-top-color:var(--navy);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.tipo{border:2px solid var(--bdr);background:#fff;border-radius:14px;padding:14px 10px;font:700 16px Barlow,sans-serif;color:var(--text);cursor:pointer;text-align:center}
.tipo span{display:block;font-size:30px;line-height:1.1;margin-bottom:4px}
.tipo small{display:block;font-weight:600;font-size:12px;color:var(--text2);margin-top:2px}
.tipo.sel{border-color:var(--navy);background:#F1F5FD;color:var(--navy)}
.nota{font-size:12.5px;color:var(--text2);margin-top:6px}
.btn.seguir{margin-top:14px;font-size:18px;padding:16px;background:linear-gradient(90deg,var(--navy),#1E6BE0)}
.btn.seguir:disabled{background:#AAB6CE}
.pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.pasos div{background:var(--surf);border-radius:12px;padding:10px 8px;font-size:12.5px;font-weight:700;text-align:center;color:var(--text)}
.pasos i{display:flex;width:26px;height:26px;margin:0 auto 6px;border-radius:50%;background:var(--navy);color:#fff;font-style:normal;align-items:center;justify-content:center;font-size:13px}
.foot{text-align:center;font-size:11.5px;color:#9AA7C2;margin-top:10px}
</style>

<body>
<div class="top"><div class="row"><div class="logo"></div><div><small>Unifrutti · Gestión Humana</small><b>Evaluación de Conocimiento ETI</b></div></div></div>
<div class="wrap" id="app"><div class="card"><div class="load"><div class="spin"></div>Cargando evaluación…</div></div></div>
<div class="bar hide" id="bar"><div class="in"><button class="btn sec" id="bPrev">← Atrás</button><button class="btn" id="bNext">Siguiente →</button></div></div>

<script>
(function(){
'use strict';
var FB_CONFIG={apiKey:"AIzaSyAv-1VcbT8VCerClNAeVtVXzOxhSffeDpc",authDomain:"sistema-eti-verfrut.firebaseapp.com",projectId:"sistema-eti-verfrut",
  storageBucket:"sistema-eti-verfrut.firebasestorage.app",messagingSenderId:"209614676744",appId:"1:209614676744:web:23b4b1cd8c18b77e9742bd"};
var COL_SES='sesiones_qr', COL_RESP='respuestas_qr', SAL='ETI-QR';
var AZ_ETI='https://rl-functions-verfrut-c0ctfjc0cjf5f0hz.brazilsouth-01.azurewebsites.net/api/etieval/guardar';   /* _ANONIMA_V2: copia en Azure SQL */
var SECTORES_BASE=['San Vicente','Algarrobos','Punta Arenas','Planta Rapel','El Papayo','Limones','Olivares Bajo','Los Olivares','Aproa','Santa Rosa'];
var app=document.getElementById('app'), bar=document.getElementById('bar'), bPrev=document.getElementById('bPrev'), bNext=document.getElementById('bNext');
/* _QR_PERMANENTE_V1: el QR permanente usa la fecha del día en que responde el trabajador; vista=1 = vista previa del supervisor (no guarda nada) */
var PREVIA=new URLSearchParams(location.search).get('vista')==='1', FECHA='';
function hoyLocal(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
var db=null, S=null, SID=null, P=[], idx=0, R={}, W={tipo:'',sector:'',ruta:'',cod:''}, ORD={}, SEED=Math.floor(Math.random()*100000)+7;
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtF(f){if(!f)return'';var p=f.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function sha(t){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('').slice(0,16);});}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
function barra(on){bar.classList.toggle('hide',!on);}
function mensaje(ico,tit,txt){barra(false);app.innerHTML='<div class="card center"><div class="big">'+ico+'</div><h1>'+tit+'</h1><p>'+txt+'</p></div><div class="foot">Unifrutti Group · Gestión Humana</div>';}
function mezclar(n,seed){var a=[];for(var i=0;i<n;i++)a.push(i);var s=seed;for(var j=n-1;j>0;j--){s=(s*9301+49297)%233280;var k=Math.floor(s/233280*(j+1));var t=a[j];a[j]=a[k];a[k]=t;}return a;}

/* 1) Validar la sesión del QR */
function iniciar(){
  SID=(new URLSearchParams(location.search).get('s')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!SID){mensaje('🔍','Código no válido','Escanea nuevamente el código QR que te muestra tu supervisor.');return;}
  try{firebase.initializeApp(FB_CONFIG);db=firebase.firestore();try{db.enablePersistence({synchronizeTabs:true}).catch(function(){});}catch(e){} if(!PREVIA)setTimeout(reenviarPendientes,1500);}catch(e){mensaje('📶','Sin conexión','No se pudo conectar. Revisa tu señal o datos móviles e inténtalo de nuevo.');return;}
  db.collection(COL_SES).doc(SID).get().then(function(d){
    if(!d.exists){mensaje('🔍','Evaluación no encontrada','El código QR no corresponde a una evaluación activa. Pide a tu supervisor que lo muestre de nuevo.');return;}
    S=d.data();
    if(S.estado!=='abierta'||(S.expira&&Date.now()>S.expira)){
      if(S.permanente) mensaje('⏸','QR pausado','Este código QR no está activo en este momento. Pide a tu supervisor o a Gestión Humana el QR vigente.');
      else mensaje('⏹','Evaluación cerrada','Esta sesión de evaluación ya fue cerrada por el supervisor.');
      return;}
    FECHA=S.permanente?hoyLocal():S.fecha;
    P=[];(S.banco||[]).forEach(function(sec){(sec.pregs||[]).forEach(function(p){P.push({sec:sec,p:p});});});
    if(!P.length){mensaje('⚠️','Evaluación sin preguntas','Comunícate con tu supervisor.');return;}
    bienvenida();
  }).catch(function(e){console.error(e);mensaje('📶','Sin conexión','No se pudo cargar la evaluación. Revisa tu señal e inténtalo otra vez.');});
}
/* 2) Bienvenida */
function bienvenida(){
  barra(false);
  app.innerHTML='<div class="card"><h1>¡Hola! 👋</h1><p>Bienvenido a la evaluación de conocimiento ETI.</p>'+
   (PREVIA?'<div class="hint" style="margin:0 0 10px">👁 <b>Vista previa para supervisores:</b> puedes recorrer las preguntas; no se guarda nada.</div>':'')+
   '<div class="info"><div><span>Empresa</span><b>'+esc(S.emp||'VERFRUT / RAPEL')+'</b></div><div><span>Fecha</span><b>'+esc(fmtF(FECHA))+'</b></div></div>'+
   '<div class="pasos"><div><i>1</i>Dinos dónde trabajas</div><div><i>2</i>Responde '+P.length+' preguntas</div><div><i>3</i>Envía y listo</div></div>'+
   '<div class="anon">🔒 <span><b>Es anónima:</b> no te pediremos DNI ni nombre. Solo si eres obrero o empleado, tu sector y tu ruta o área.</span></div>'+
   '<ul class="tips"><li>📝 <span><b>'+P.length+' preguntas</b> de opción múltiple.</span></li><li>👆 <span>Toca la respuesta que creas correcta. Algunas permiten marcar varias.</span></li><li>⏱ <span>Toma entre 8 y 12 minutos. Responde tú solo, con calma.</span></li></ul>'+
   '<div style="margin-top:16px"><button class="btn" id="bIr">Comenzar →</button></div></div><div class="foot">Supervisor: '+esc(S.sup)+'</div>';
  var pr=PREVIA?null:progLeer();
  if(pr){var c=document.createElement('div');c.className='anon';c.style.cssText='background:#EEF3FB;color:#003DA5;margin-top:12px';
    c.innerHTML='↩ <span>Tienes una evaluación a medias (<b>'+Object.keys(pr.R).length+' de '+P.length+'</b> respondidas). <button class="btn" id="bCont" style="margin-top:8px;padding:12px">Continuar donde me quedé</button></span>';
    var card=app.querySelector('.card'); card.insertBefore(c,card.querySelector('.tips'));
    document.getElementById('bCont').onclick=function(){R=pr.R||{};W=pr.W||W;ORD=pr.ORD||{};SEED=pr.SEED||SEED;idx=Math.min(pr.idx||0,P.length-1);
      var falt=P.findIndex(function(x){return !(R[x.p.n]&&R[x.p.n].length);}); if(falt>=0)idx=falt;
      if(!W||!W.tipo){ubicacion();return;} if(falt<0){revisar();return;} pregunta();window.scrollTo(0,0);};}
  document.getElementById('bIr').onclick=PREVIA?function(){W={tipo:'obrero',emp:'',sector:'VISTA PREVIA',ruta:'-',cod:'-'};idx=0;R={};pregunta();window.scrollTo(0,0);}:ubicacion;
}
/* 3) Ubicación del trabajador (anónima)
   _QR_PERSONAL_V1 (03-oct-2026): un solo QR para todo el personal.
   Obrero   → sector/fundo + ruta + código de ruta.
   Empleado → área + sector/zona donde trabaja hoy (puede ser distinto a su área; sin código). */
function ubicacion(){
  barra(false);
  var sects=(S.sectores&&S.sectores.length?S.sectores:SECTORES_BASE), areas=(S.areas||[]);
  var last={}; try{last=JSON.parse(ls('eti_qr_ult')||'{}')||{};}catch(e){}
  var fijo=(S.tipo==='obrero'||S.tipo==='empleado')?S.tipo:'';
  var empFija=S.emp||'';
  var st={emp:empFija||W.emp||last.emp||'',tipo:fijo||W.tipo||last.tipo||'',sector:W.sector||S.sector||last.sector||'',ruta:W.ruta||'',cod:W.cod||'',area:''};
  if(st.tipo==='empleado'){st.area=st.ruta||(last.tipo==='empleado'?last.ruta:'')||'';st.ruta='';}
  else if(!st.ruta&&last.tipo!=='empleado'){st.ruta=last.ruta||'';st.cod=st.cod||last.cod||'';}
  function leer(){var g=function(id){var e=document.getElementById(id);return e?e.value:null;};
    var v;if((v=g('sec'))!==null){st.otro=(v==='__otro__');if(!st.otro)st.sector=v;}if(st.otro&&(v=g('secOtro'))!==null)st.sector=v;if((v=g('ruta'))!==null)st.ruta=v;if((v=g('cod'))!==null)st.cod=v;if((v=g('area'))!==null)st.area=v;}
  function selSector(lbl){
    /* _SECTOR_EDITABLE_V1: el sector del QR solo viene preseleccionado; el trabajador siempre puede cambiarlo */
    /* _SECTOR_OTRO_V1: si su sector, planta o zona no está en la lista, elige "Otro" y lo escribe */
    var ops=sects.slice(), otro=st.otro||(st.sector&&ops.indexOf(st.sector)<0&&st.sector!==S.sector);
    if(!otro&&st.sector&&ops.indexOf(st.sector)<0) ops.unshift(st.sector);
    return '<label for="sec">'+lbl+'</label><select id="sec"><option value="">— Elige —</option>'+ops.map(function(x){return '<option'+(!otro&&x===st.sector?' selected':'')+'>'+esc(x)+'</option>';}).join('')+
      '<option value="__otro__"'+(otro?' selected':'')+'>✏️ Otro (no está en la lista: escribirlo)</option></select>'+
      (otro?'<input id="secOtro" autocomplete="off" placeholder="Escribe tu sector, planta o zona" value="'+esc(st.sector||'')+'" style="margin-top:8px">':'');
  }
  function pintar(){
    var h='<div class="card"><h2>¿Dónde trabajas hoy?</h2><p>Estos datos sirven para ver los resultados por sector, ruta o área. <b>No se guarda tu nombre ni tu DNI.</b></p>';
    if(!empFija) h+='<label>¿En qué empresa trabajas?</label><div class="tipos">'+
      ['VERFRUT S.A.C.','RAPEL S.A.C.'].map(function(e){return '<button type="button" class="tipo emp'+(st.emp===e?' sel':'')+'" data-e="'+e+'"><span>🏢</span>'+e.replace(' S.A.C.','')+'</button>';}).join('')+'</div>';
    if(!fijo) h+='<label>¿Qué tipo de trabajador eres?</label><div class="tipos">'+
      '<button type="button" class="tipo'+(st.tipo==='obrero'?' sel':'')+'" data-t="obrero"><span>👷</span>Obrero<small>Trabajo por ruta</small></button>'+
      '<button type="button" class="tipo'+(st.tipo==='empleado'?' sel':'')+'" data-t="empleado"><span>💼</span>Empleado<small>Trabajo en un área</small></button></div>';
    else h+='<label>Tipo de trabajador</label><div class="fijo">'+(fijo==='obrero'?'👷 Obrero':'💼 Empleado')+'</div>';
    if(st.tipo==='obrero'){
      h+=selSector('Sector o fundo')+
        '<label for="ruta">Ruta</label><input id="ruta" autocomplete="off" placeholder="Ej. Ruta 5" value="'+esc(st.ruta)+'">'+
        '<label for="cod">Código de la ruta</label><input id="cod" autocomplete="off" placeholder="Ej. R-05" value="'+esc(st.cod)+'">';
    }else if(st.tipo==='empleado'){
      h+='<label for="area">Área a la que perteneces</label><input id="area" list="lAreas" autocomplete="off" placeholder="Ej. Administración" value="'+esc(st.area)+'">'+
        '<datalist id="lAreas">'+areas.map(function(a){return '<option value="'+esc(a)+'">';}).join('')+'</datalist>'+
        selSector('Sector o zona donde estás trabajando')+
        '<div class="nota">Ej.: si eres de Administración pero hoy estás en Algarrobos, elige Algarrobos. Si tu sector, planta o zona no está en la lista, elige <b>✏️ Otro</b> y escríbelo.</div>';
    }
    h+='<div class="err" id="err"></div><div style="margin-top:18px"><button class="btn" id="bOk"'+(st.tipo?'':' disabled')+'>Continuar →</button></div></div>';
    app.innerHTML=h;
    var se=document.getElementById('sec'); if(se) se.onchange=function(){var era=st.otro;leer();if(st.otro!==era){if(st.otro)st.sector='';pintar();var i=document.getElementById('secOtro');if(i)i.focus();}};
    Array.prototype.forEach.call(app.querySelectorAll('.tipo'),function(b){b.onclick=function(){leer();if(b.getAttribute('data-e'))st.emp=b.getAttribute('data-e');else st.tipo=b.getAttribute('data-t');pintar();};});
    document.getElementById('bOk').onclick=continuar;
  }
  function continuar(){
    leer();
    var err=document.getElementById('err'), up=function(x){return String(x||'').trim().replace(/\s+/g,' ').toUpperCase();};
    var falla=function(t){err.textContent=t;err.style.display='block';};
    err.style.display='none';
    if(!st.emp) return falla('Elige tu empresa.');
    if(!st.tipo) return falla('Elige si eres obrero o empleado.');
    if(st.tipo==='obrero'){
      var ruta=up(st.ruta), cod=up(st.cod).replace(/\s+/g,'');
      st.sector=String(st.sector||'').trim().replace(/\s+/g,' ').slice(0,60);if(st.otro)st.sector=st.sector.toLowerCase().replace(/(^|\s)\S/g,function(c){return c.toUpperCase();});
      if(!st.sector) return falla(st.otro?'Escribe tu sector o fundo.':'Elige tu sector o fundo.');
      if(!ruta) return falla('Escribe tu ruta.');
      if(!cod) return falla('Escribe el código de tu ruta.');
      progBorrar(); W={emp:st.emp,tipo:'obrero',sector:st.sector,ruta:ruta.slice(0,60),cod:cod.slice(0,30)};
    }else{
      var area=up(st.area);
      if(!area) return falla('Escribe tu área.');
      st.sector=String(st.sector||'').trim().replace(/\s+/g,' ').slice(0,60);if(st.otro)st.sector=st.sector.toLowerCase().replace(/(^|\s)\S/g,function(c){return c.toUpperCase();});
      if(!st.sector) return falla(st.otro?'Escribe el sector o zona donde estás trabajando.':'Elige el sector o zona donde estás trabajando.');
      progBorrar(); W={emp:st.emp,tipo:'empleado',sector:st.sector,ruta:area.slice(0,60),cod:''};
    }
    ls('eti_qr_ult',JSON.stringify(W));
    idx=0;R={};progGuardar();pregunta();window.scrollTo(0,0);
  }
  pintar();
}
/* 4) Preguntas: una por pantalla */
/* _CONTINUAR_V1 (07-oct-2026): el avance se guarda en el celular; si se cierra o se va la señal, al volver a escanear continúa donde se quedó */
var PROG_K=function(){return 'eti_qr_prog_'+SID+'_'+(S&&S.bancoVersion||0);};
function progGuardar(){if(PREVIA)return;try{localStorage.setItem(PROG_K(),JSON.stringify({R:R,idx:idx,W:W,ORD:ORD,SEED:SEED,t:Date.now()}));}catch(e){}}
function progLeer(){try{var x=JSON.parse(localStorage.getItem(PROG_K())||'null');if(x&&Date.now()-x.t<12*3600e3&&x.R&&Object.keys(x.R).length)return x;}catch(e){}return null;}
function progBorrar(){try{localStorage.removeItem(PROG_K());}catch(e){}}
function pregunta(){
  var it=P[idx], p=it.p, multi=p.tipo==='multiple', sel=R[p.n]||[];
  if(!ORD[p.n]) ORD[p.n]=mezclar(p.ops.length,SEED+p.n*31);
  var hechas=Object.keys(R).filter(function(k){return R[k]&&R[k].length;}).length;
  app.innerHTML='<div class="card"><div class="prog"><span>Pregunta '+(idx+1)+' de '+P.length+'</span><span>'+hechas+' respondida'+(hechas===1?'':'s')+'</span></div>'+
   '<div class="track"><i style="width:'+(hechas/P.length*100)+'%"></i></div><span class="tema">Tema '+((S.banco||[]).indexOf(it.sec)+1)+' de '+(S.banco||[]).length+' · '+esc(it.sec.nom)+'</span><h2>'+esc(p.t)+'</h2>'+
   (multi?'<div class="hint">✔ Puedes marcar varias respuestas</div>':'')+
   ORD[p.n].map(function(i){var on=sel.indexOf(i)>=0;return '<button class="op'+(multi?' multi':'')+(on?' sel':'')+'" data-i="'+i+'"><span class="mk">'+(on?'✓':'')+'</span><span>'+esc(p.ops[i])+'</span></button>';}).join('')+''+
   '<button class="btn seguir" id="bSeguir"'+(sel.length?'':' disabled')+'>'+(idx===P.length-1?'Revisar y enviar →':'Seguir →')+'</button>'+
   (sel.length?'':'<div class="nota center" style="margin-top:8px">Marca una respuesta para poder seguir.</div>')+'</div>';
  Array.prototype.forEach.call(app.querySelectorAll('.op'),function(b){b.onclick=function(){
    var i=+b.getAttribute('data-i'), a=(R[p.n]||[]).slice();
    if(multi){var k=a.indexOf(i);if(k>=0)a.splice(k,1);else a.push(i);}else a=[i];
    R[p.n]=a; try{if(navigator.vibrate)navigator.vibrate(12);}catch(e){} progGuardar(); pregunta();
    /* _BOTON_SEGUIR_V1 (06-oct-2026): ya no pasa sola; el trabajador ve su respuesta marcada y toca "Seguir" */
    var bs=document.getElementById('bSeguir'); if(bs) setTimeout(function(){try{bs.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}},60);
  };});
  barra(true);
  bPrev.textContent=idx===0?(W.tipo==='empleado'?'← Mi área':'← Mi ruta'):'← Atrás';
  bPrev.onclick=function(){if(idx===0)ubicacion();else{idx--;pregunta();}window.scrollTo(0,0);};
  bNext.disabled=!(R[p.n]&&R[p.n].length);
  bNext.textContent=idx===P.length-1?'Revisar y enviar →':'Siguiente →';
  bNext.onclick=function(){if(idx<P.length-1){idx++;pregunta();}else revisar();window.scrollTo(0,0);};
  var bS=document.getElementById('bSeguir'); if(bS) bS.onclick=function(){if(!(R[p.n]&&R[p.n].length))return;bNext.onclick();};
}
/* 5) Revisión */
function revisar(){
  var falt=P.filter(function(x){return !(R[x.p.n]&&R[x.p.n].length);});
  app.innerHTML='<div class="card"><h2>Revisa antes de enviar</h2><p>'+(falt.length?'Te faltan <b>'+falt.length+'</b> pregunta(s). Tócalas para responderlas.':'¡Respondiste todas las preguntas! 🎉 Ya puedes enviar tu evaluación.')+'</p>'+
   '<div class="resumen">'+P.map(function(x,i){var ok=R[x.p.n]&&R[x.p.n].length;return '<i class="'+(ok?'':'no')+'" data-i="'+i+'">'+(i+1)+'</i>';}).join('')+'</div>'+
   '<p style="font-size:13px">Una vez enviada no podrás modificarla.</p><div class="err" id="err"></div></div>';
  Array.prototype.forEach.call(app.querySelectorAll('.resumen i'),function(e){e.onclick=function(){idx=+e.getAttribute('data-i');pregunta();window.scrollTo(0,0);};});
  barra(true);
  bPrev.textContent='← Volver';bPrev.onclick=function(){idx=P.length-1;pregunta();};
  bNext.disabled=!!falt.length;bNext.textContent='Enviar evaluación ✓';bNext.onclick=enviar;
  if(PREVIA){bNext.disabled=false;bNext.textContent='Terminar vista previa';bNext.onclick=function(){mensaje('👁','Fin de la vista previa','Así verán la evaluación los trabajadores. No se guardó ninguna respuesta.');};}
}
/* 6) Calificación automática y envío */
function calificar(){
  var tareas=P.map(function(x){
    var p=x.p;return Promise.all(p.ops.map(function(_,i){return sha(SID+'|'+p.n+'|'+i+'|'+SAL);})).then(function(hs){
      var corr=[];hs.forEach(function(h,i){if((p.k||[]).indexOf(h)>=0)corr.push(i);});
      var sel=R[p.n]||[], pts=0;
      if(p.tipo==='multiple'){var a=sel.filter(function(i){return corr.indexOf(i)>=0;}).length,b=sel.length-a;pts=corr.length?Math.max(0,(a-b)/corr.length)*p.max:0;}
      else pts=(sel.length===1&&corr.indexOf(sel[0])>=0)?p.max:0;
      return {n:p.n,sec:x.sec.id,pts:Math.round(pts*100)/100};
    });
  });
  return Promise.all(tareas).then(function(rs){
    var ptsN={};rs.forEach(function(r){ptsN[r.n]=r.pts;});
    var secs=(S.banco||[]).map(function(sec){var s=rs.filter(function(r){return r.sec===sec.id;}).reduce(function(a,r){return a+r.pts;},0);
      return {id:sec.id,nom:sec.nom,peso:sec.peso,max:sec.maxSec,pts:Math.round(s*100)/100,pct:sec.maxSec?s/sec.maxSec:0};});
    var resultado=secs.reduce(function(a,s){return a+s.pct*s.peso;},0);
    return {ptsN:ptsN,secs:secs,resultado:Math.round(resultado*10000)/10000};
  });
}
/* _ENVIO_SEGURO_V1 (03-oct-2026)
   - La respuesta se guarda primero en el celular (localStorage) y recién luego se envía.
   - Firebase es la fuente principal (de ahí se consolida al cerrar la sesión); Azure es la copia.
   - Reintentos automáticos con espera creciente, al recuperar señal y la próxima vez que se abra la página.
   - Mismo id en todos los reintentos: nunca se duplica. El trabajador nunca ve puntajes ni %. */
var PEND_K='eti_qr_pend', PACK=null, autoT=null;
function espera(ms){return new Promise(function(r){setTimeout(r,ms);});}
function pendLeer(){try{return JSON.parse(ls(PEND_K)||'{}')||{};}catch(e){return {};}}
function pendPoner(p){var m=pendLeer();m[p.id]=p;ls(PEND_K,JSON.stringify(m));}
function pendQuitar(id){var m=pendLeer();delete m[id];ls(PEND_K,JSON.stringify(m));}
function subirFS(p,intentos){
  var ref=db.collection(COL_RESP).doc(p.id);
  var go=function(n){
    return Promise.race([ref.set(p.doc),espera(15000).then(function(){throw new Error('timeout');})])
      .then(function(){return true;},function(e){console.warn('Firebase intento '+n,e&&e.message);
        if(n<intentos) return espera(1500*n).then(function(){return go(n+1);}); return false;});
  };
  return go(1);
}
function subirAZ(p,intentos){
  var go=function(n){
    return fetch(AZ_ETI,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({registros:[p.reg]}),keepalive:true})
      .then(function(r){if(!r.ok)throw new Error('Azure '+r.status);return r.json().catch(function(){return {};});})
      .then(function(j){if(j&&j.success===false)throw new Error(j.error||'Azure rechazó');return true;})
      .catch(function(e){console.warn('Azure intento '+n,e&&e.message);if(n<intentos)return espera(2000*n).then(function(){return go(n+1);});return false;});
  };
  return go(1);
}
function despachar(p,iFs,iAz){
  var t=[];
  if(!p.fs&&db) t.push(subirFS(p,iFs||4).then(function(ok){if(ok)p.fs=true;}));
  if(!p.az) t.push(subirAZ(p,iAz||4).then(function(ok){if(ok)p.az=true;}));
  return Promise.all(t).then(function(){
    /* _TRAFICO_V1: marca en Firebase que Azure ya lo tiene (el panel de tráfico lo muestra con ☁ ✓) */
    if(p.fs&&p.az&&!p.azMarcado&&db) return db.collection(COL_RESP).doc(p.id).set({azOk:true,azEn:new Date().toISOString()},{merge:true})
      .then(function(){p.azMarcado=true;},function(e){console.warn('marca azOk',e&&e.message);p.azMarcado=true;});
  }).then(function(){if(p.fs&&p.az)pendQuitar(p.id);else pendPoner(p);return p;});
}
function reenviarPendientes(){
  var m=pendLeer(), lim=Date.now()-10*864e5;
  Object.keys(m).forEach(function(id){var p=m[id];
    if(!p||!p.doc||(p.t||0)<lim){pendQuitar(id);return;}
    if(PACK&&PACK.id===id) return;
    despachar(p,2,1);});
}
function enviar(){
  if(PREVIA) return;
  clearTimeout(autoT);
  bNext.disabled=true;bPrev.disabled=true;bNext.textContent='Enviando…';
  var er=document.getElementById('err');if(er)er.style.display='none';
  var prep=PACK?Promise.resolve(PACK):calificar().then(function(c){
    if(!W.docId) W.docId=db.collection(COL_RESP).doc().id;   /* mismo id en reintentos: no duplica */
    var doc={sesion:SID,anonima:true,emp:W.emp||S.emp,sup:S.sup,sector:W.sector,tipo:W.tipo||S.tipo,ruta:W.ruta,cod:W.cod,fecha:FECHA,
      usuarioSup:S.asignado||S.usuario||'',resp:R,pts:c.ptsN,secs:c.secs,resultado:c.resultado,estado:c.resultado>=0.7?'APROBADO':'REFUERZO',
      bancoVersion:S.bancoVersion||0,creadoEn:new Date().toISOString(),ts:Date.now()};
    var reg={id:W.docId,modalidad:'QR',sesion_id:SID,fecha:FECHA,empresa:W.emp||S.emp,supervisor:S.sup,usuario:S.asignado||S.usuario||'',sector:W.sector,tipo:W.tipo||S.tipo,
      ruta:W.ruta,codigo:W.cod,evaluados:1,resultado:c.resultado,banco_version:S.bancoVersion||0,
      secciones:c.secs.map(function(x){return {id:x.id,nom:x.nom,peso:x.peso,pct:x.pct};})};
    PACK={id:W.docId,doc:doc,reg:reg,fs:false,az:false,t:Date.now()};
    pendPoner(PACK);   /* respaldo en el celular ANTES de enviar */
    return PACK;
  });
  prep.then(function(p){return despachar(p);}).then(function(p){
    if(p.fs||p.az){fin();return;}   /* lo que falte (Firebase o Azure) se sigue reintentando en segundo plano */
    throw new Error('sin envio');
  }).catch(function(e){
    console.error(e);bNext.disabled=false;bPrev.disabled=false;bNext.textContent='Reintentar envío ↻';
    var er=document.getElementById('err');if(er){er.textContent='Sin señal por ahora. Tus respuestas están guardadas en tu celular y se reintentará solo en unos segundos. No cierres esta página.';er.style.display='block';}
    autoT=setTimeout(enviar,10000);
  });
}
window.addEventListener('online',function(){if(PACK&&!PACK.fs){if(W.enviado)despachar(PACK).then(function(p){if(p.fs)cierre();});else enviar();}else reenviarPendientes();});
/* 7) Fin: mensaje y salida del sitio */
function fin(){
  W.enviado=true; progBorrar();
  barra(false);
  if(PACK&&!(PACK.fs&&PACK.az)){   /* esperamos que Firebase Y Azure confirmen antes de cerrar (Azure: máx. ~25 s; luego lo reenvía el panel) */
    app.innerHTML='<div class="card center"><div class="ok-anim"><svg viewBox="0 0 24 24" fill="none" stroke="#007A3D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>'+
     '<h1>Evaluación recibida</h1><p style="font-size:17px;color:var(--text)"><b>¡Gracias por participar!</b></p><p id="cuenta">Terminando de guardar… espera unos segundos antes de cerrar.</p></div>';
    var t0=Date.now();
    var listo=function(){return PACK.fs&&(PACK.az||Date.now()-t0>25000);};
    var loop=function(){if(listo()){cierre();return;}despachar(PACK,2,2).then(function(){setTimeout(loop,listo()?0:6000);});};
    setTimeout(loop,1500);
    return;
  }
  cierre();
}
var _cerrando=false;
function cierre(){
  if(_cerrando) return; _cerrando=true;
  var t=6;
  app.innerHTML='<div class="card center"><div class="ok-anim"><svg viewBox="0 0 24 24" fill="none" stroke="#007A3D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>'+
   '<h1>Evaluación enviada</h1><p style="font-size:17px;color:var(--text)"><b>¡Gracias por participar!</b></p><p>Tus respuestas fueron registradas correctamente.</p>'+
   '<p style="font-size:13px" id="cuenta">Esta página se cerrará en '+t+' segundos…</p></div>';
  try{history.replaceState(null,'','evaluar.html');}catch(e){}
  var iv=setInterval(function(){t--;var c=document.getElementById('cuenta');if(c)c.textContent='Esta página se cerrará en '+t+' segundos…';
    if(t<=0){clearInterval(iv);salir();}},1000);
}
function salir(){
  R={};W={tipo:'',sector:'',ruta:'',cod:''};
  try{window.open('','_self');window.close();}catch(e){}
  setTimeout(function(){
    app.innerHTML='<div class="card center"><div class="big">👋</div><h1>¡Hasta pronto!</h1><p>Ya puedes cerrar esta pestaña.</p></div>';
    try{location.replace('about:blank');}catch(e){}
  },400);
}
window.addEventListener('beforeunload',function(e){if((P.length&&Object.keys(R).length&&!W.enviado)||(PACK&&!PACK.fs)){e.preventDefault();e.returnValue='';}});
iniciar();
})();
</script>
